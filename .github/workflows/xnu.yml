name: xnu

run-name: XNU DEVELOPMENT.SWEET (${{ github.sha }})

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"
      - "tools/check-arm64-lse.py"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"
      - "tools/check-arm64-lse.py"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  # The upstream 0001-0081 series is fetched at build time from the MIT
  # ios-sweet repo instead of being mirrored here: Apple-authored
  # source text (embedded copyright headers) must not live in this
  # repo; patches shipped in this repo are Exynos-only.
  SWEET_REPO: https://github.com/dipa-studio/ios-sweet
  SWEET_SHA: 45263bee51df4a0f55cdf9c649af886399488ddb
  # Fixed target: macOS 13.5's XNU 8796.141.3, DEVELOPMENT, SWEET.
  MACOS_VERSION: "13.5"
  XNU_VERSION: "xnu-8796.141.3"
  XNU_COMMIT: "1b191cb58250d0705d8a51287127505aa4bc0789"
  KERNEL_CONFIG: DEVELOPMENT
  ARCH_CONFIG: ARM64
  MACHINE_CONFIG: SWEET

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned build script and upstream patch series
        run: |
          set -euo pipefail
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          git init -q sweet
          git -C sweet fetch -q --depth 1 "$SWEET_REPO" "$SWEET_SHA"
          git -C sweet checkout -q FETCH_HEAD
          cp sweet/xnu/patches/* xnu/patches/
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          test -f dxb/patches/0084-a30s-4k-user-va.patch

          # Pinned wrapper currently resolves XNU through a live release
          # manifest. Make its existing overrideable assignment honor the
          # exact source tag fixed above; fail if upstream changes that line.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dxb/build.sh")
          s = p.read_text()
          old = '''XNU_VERSION=$(curl -s $RELEASE_URL | jq -r '.projects[] | select(.project=="xnu") | .tag')'''
          new = '''XNU_VERSION="${XNU_VERSION:-$(curl -s $RELEASE_URL | jq -r '.projects[] | select(.project=="xnu") | .tag')}"'''
          if s.count(old) != 1:
              raise SystemExit("pinned build.sh get_xnu assignment changed; refusing an unverified edit")
          p.write_text(s.replace(old, new))
          PY
          grep -F 'XNU_VERSION="${XNU_VERSION:-$(curl -s $RELEASE_URL' dxb/build.sh

          # libfirehose_kernel is a separate Xcode build: its arm64 default
          # otherwise follows the macOS runner CPU. Build only the kernel's
          # arm64 slice and pass the same baseline ISA explicitly.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dxb/build.sh")
          s = p.read_text()
          old = 'ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"'
          new = 'ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-march=armv8-a+crypto"'
          if s.count(old) != 1:
              raise SystemExit("pinned build.sh libfirehose target changed; refusing an unverified edit")
          p.write_text(s.replace(old, new))
          PY
          grep -F 'ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-march=armv8-a+crypto"' dxb/build.sh
          ls dxb/patches | wc -l

      - name: Install dependencies and select Xcode
        run: |
          brew install jq gum bash cmake ninja
          # build.sh checks xcodes, while Xcode is preinstalled on macos-14.
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build XNU DEVELOPMENT.SWEET
        working-directory: dxb
        env:
          XNU_VERSION: ${{ env.XNU_VERSION }}
        run: |
          set -euo pipefail
          # A new checkout has no build directory; make stale-output reuse fatal.
          test ! -e build/xnu.obj/kernel.development.sweet
          bash build.sh 2>&1 | tee ../xnu-build.log

      - name: Verify source revision, applied target, and fresh kernel
        run: |
          set -euo pipefail
          test "$(git -C dxb/xnu describe --tags --exact-match)" = "$XNU_VERSION"
          test "$(git -C dxb/xnu rev-parse HEAD)" = "$(git -C dxb/xnu rev-parse "$XNU_VERSION^{commit}")"
          test "$(git -C dxb/xnu rev-parse HEAD)" = "$XNU_COMMIT"
          grep -F 'MACHINE_FLAGS_ARM64_SWEET = -DARM64_BOARD_CONFIG_SWEET' dxb/xnu/makedefs/MakeInc.def
          grep -F 'LARGE_MEMORY_DEFINE=-UARM_LARGE_MEMORY -DSWEET_4K_USERVA=1 -march=armv8-a+crypto' dxb/xnu/makedefs/MakeInc.def
          grep -F '&& !defined(SWEET_4K_USERVA)' dxb/xnu/osfmk/mach/arm/vm_param.h
          if grep -E '^[[:space:]]*#define[[:space:]]+__ARM_PAN_AVAILABLE__([[:space:]]|$)' dxb/xnu/pexpert/pexpert/arm64/SWEET.h; then
            echo 'Patch 0084 did not remove the SWEET PAN feature declaration' >&2
            exit 1
          fi
          if grep -E 'MACHINE_FLAGS_ARM64_SWEET.*(armv8\.[1-9]|\+lse)' dxb/xnu/makedefs/MakeInc.def; then
            echo 'Unexpected SWEET target enables ARMv8.1+ or LSE' >&2
            exit 1
          fi
          # Inspect actual SWEET clang compile commands. The target setting must
          # be the last architecture selector, after Apple's `-arch` option.
          python3 - <<'PY'
          import shlex
          from pathlib import Path
          commands = []
          firehose_commands = []
          for line in Path("xnu-build.log").read_text(errors="replace").splitlines():
              if "clang" not in line:
                  continue
              try:
                  args = shlex.split(line)
              except ValueError:
                  continue
              if "firehose_buffer.c" in line and "-target" in args:
                  firehose_commands.append(args)
              if "ARM64_BOARD_CONFIG_SWEET" not in line:
                  continue
              selectors = [arg for arg in args if arg.startswith(("-march=", "-mcpu="))]
              if selectors:
                  arch_positions = [i for i, arg in enumerate(args) if arg == "-arch"]
                  march_positions = [i for i, arg in enumerate(args) if arg.startswith("-march=")]
                  commands.append((selectors[-1], args, arch_positions, march_positions))
          if not commands:
              raise SystemExit("no verbose SWEET clang compile commands found in build log")
          bad = [(selector, args) for selector, args, arch_pos, march_pos in commands
                 if selector != "-march=armv8-a+crypto"
                 or any("+lse" in arg.lower() for arg in args)
                 or not arch_pos or not march_pos or march_pos[-1] < arch_pos[-1]]
          if bad:
              for selector, args in bad[:10]:
                  print("unexpected compiler target:", selector, " ".join(args))
              raise SystemExit("SWEET compiler command does not apply ARMv8-A after -arch or enables LSE")
          if len(firehose_commands) != 1:
              raise SystemExit(f"expected one arm64 firehose_buffer.c compile, found {len(firehose_commands)}")
          firehose = firehose_commands[0]
          march = [i for i, arg in enumerate(firehose) if arg.startswith("-march=")]
          target = next((firehose[i + 1] for i, arg in enumerate(firehose[:-1]) if arg == "-target"), "")
          target_pos = next((i for i, arg in enumerate(firehose[:-1]) if arg == "-target"), -1)
          if (target != "arm64-apple-macos14.0" or not march
                  or firehose[march[-1]] != "-march=armv8-a+crypto"
                  or march[-1] < target_pos
                  or any("+lse" in arg.lower() for arg in firehose)):
              raise SystemExit("libfirehose arm64 compile is not constrained to ARMv8-A")
          print(f"verified {len(commands)} SWEET commands apply ARMv8-A after -arch")
          print("verified libfirehose arm64 compile uses ARMv8-A")
          PY
          test -s dxb/fakeroot/System/Library/Kernels/kernel.development.sweet

      - name: Check kernel executable sections for LSE instructions
        id: lse_scan
        run: |
          set -euo pipefail
          python3 -m venv .venv-lse-check
          . .venv-lse-check/bin/activate
          python -m pip install --disable-pip-version-check 'capstone==5.0.6'
          set +e
          python tools/check-arm64-lse.py dxb/fakeroot/System/Library/Kernels/kernel.development.sweet 2>&1 | tee lse-scan.log
          scan_status=${PIPESTATUS[0]}
          set -e
          exit "$scan_status"

      - name: Capture failed kernel and symbols for LSE diagnosis
        if: always() && steps.lse_scan.outcome == 'failure'
        run: |
          set -euo pipefail
          diag=failed-kernel-diagnostic
          obj=dxb/build/xnu.obj/DEVELOPMENT_ARM64_SWEET
          candidate=dxb/fakeroot/System/Library/Kernels/kernel.development.sweet
          mkdir -p "$diag"
          test -s "$candidate"
          cp "$candidate" "$diag/kernel.development.sweet.candidate"
          for item in \
            "$obj/kernel.development.sweet.unstripped" \
            "$obj/kernel.development.sweet.dSYM" \
            "$obj/kernel.development.sweet.link/kernel.development.sweet.a" \
            "$obj/kernel.development.sweet.link/kernel.development.sweet.exp" \
            "$obj/kernel.development.sweet.link/kernel.development.sweet.alias.exp" \
            "$obj/kernel.development.sweet.link/kernel.development.sweet.linkarguments" \
            "$obj/kernel.development.sweet.link/kernel.development.sweet.linkarchives" \
            dxb/fakeroot/usr/local/lib/kernel/libfirehose_kernel.a \
            dxb/libdispatch/src/firehose/firehose_buffer.c; do
            if [ -e "$item" ]; then
              cp -R "$item" "$diag/"
            else
              echo "missing diagnostic input: $item" >> "$diag/MISSING.txt"
            fi
          done
          xcrun nm -nm "$obj/kernel.development.sweet.unstripped" > "$diag/kernel-symbols.nm.txt" 2>&1 || true
          dwarf="$obj/kernel.development.sweet.dSYM/Contents/Resources/DWARF/kernel.development.sweet"
          if [ -s "$dwarf" ]; then
            xcrun atos -arch arm64 -o "$dwarf" -l 0xfffffff007004000 \
              0xfffffff00725c188 0xfffffff00725c23c 0xfffffff007272d54 \
              > "$diag/representative-addresses.atos.txt" 2>&1 || true
          fi
          cp lse-scan.log "$diag/" || true
          {
            echo "repository_commit=$GITHUB_SHA"
            echo "xnu_commit=$(git -C dxb/xnu rev-parse HEAD)"
            echo "libdispatch_commit=$(git -C dxb/libdispatch rev-parse HEAD)"
            echo "kernel_candidate=$candidate"
            echo "kernel_candidate_sha256=$(shasum -a 256 "$candidate" | awk '{print $1}')"
            echo "kernel_candidate_bytes=$(stat -f %z "$candidate")"
            echo "scan_status=failure; candidate is diagnostic only and is not a verified artifact"
          } > "$diag/DIAGNOSTIC-PROVENANCE.txt"
          (cd "$diag" && find . -type f ! -name SHA256SUMS -print0 | xargs -0 shasum -a 256 > SHA256SUMS)

      - name: Upload failed kernel diagnosis bundle
        if: always() && steps.lse_scan.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: xnu-failed-kernel-diagnostic-${{ github.sha }}
          path: failed-kernel-diagnostic/
          if-no-files-found: error
          retention-days: 7

      - name: Collect verified kernel and provenance
        run: |
          set -euo pipefail
          mkdir -p out
          cp dxb/fakeroot/System/Library/Kernels/kernel.development.sweet out/kernel.development.sweet
          shasum -a 256 out/kernel.development.sweet > out/SHA256SUMS
          cat > out/BUILD-PROVENANCE.txt <<EOF
          repository_commit=${GITHUB_SHA}
          darwin_xnu_build_commit=${DXB_SHA}
          upstream_patch_repository_commit=${SWEET_SHA}
          xnu_tag=${XNU_VERSION}
          xnu_expected_commit=${XNU_COMMIT}
          xnu_commit=$(git -C dxb/xnu rev-parse HEAD)
          macos_release=${MACOS_VERSION}
          kernel_config=${KERNEL_CONFIG}
          arch_config=${ARCH_CONFIG}
          machine_config=${MACHINE_CONFIG}
          applied_a30s_patch=0084-a30s-4k-user-va.patch
          verified_sweet_arch_flags=-march=armv8-a+crypto
          EOF

      - name: Upload XNU build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-build-log-${{ github.sha }}
          path: xnu-build.log
          if-no-files-found: warn

      - name: Package build tree for local compiles
        if: always()
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree-${{ github.sha }}
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p diagnostics/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "diagnostics/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "diagnostics/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> diagnostics/kdk-libs/arch.txt 2>&1 || true
          done

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xnu-kernel-${{ github.sha }}
          path: out/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-build-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: warn
